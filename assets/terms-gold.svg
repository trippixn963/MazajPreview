      <path d="M4.3 1.5 h7.4 a.85.85 0 0 1 .85.85 v11.3 a.85.85 0 0 1 -.85.85 h-7.4 a.85.85 0 0 1 -.85-.85 V2.35 a.85.85 0 0 1 .85-.85 Z M5.75 4.75 h4.5 v1.25 h-4.5 Z M5.75 7.4 h4.5 v1.25 h-4.5 Z M5.75 10.05 h3 v1.25 h-3 Z" fill="url(#mz-terms-gold)" fill-rule="evenodd"/>
    </g>
    <rect width="16" height="16" fill="url(#mz-terms-sheen)"/>
    <ellipse cx="5.4" cy="3.1" rx="5.2" ry="2.9" fill="#fff" opacity=".19"
